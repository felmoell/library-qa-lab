# JUnit Platform configuration, picked up automatically from the test classpath.
# Run tests in a deterministic order inside a class (by @Order, else by method name):
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation
# Exercise (LEARNING-PATH.md, J7): turn on parallel execution and see what breaks.
junit.jupiter.execution.parallel.enabled=false
