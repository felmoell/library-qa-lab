spring:
  application:
    name: library
  datasource:
    # Local PostgreSQL (one-time setup: see README "Quick start"); CI starts one with the same credentials.
    # Point elsewhere with SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
    url: jdbc:postgresql://localhost:5432/library
    username: library
    password: library
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, Hibernate only checks it
  web:
    # Always answer in English (validation messages would otherwise follow the JVM / Accept-Language locale).
    locale: en
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
